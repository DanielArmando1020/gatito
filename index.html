<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Lo siento</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#0b1020;
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        linear-gradient(
            to bottom,
            #080d1d 0%,
            #101936 48%,
            #172344 70%,
            #24304a 100%
        );
}

/* =========================
   ESTRELLAS
========================= */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:#fff;
    box-shadow:0 0 4px #fff;
    image-rendering:pixelated;
}

.s1{left:7%;top:12%}
.s2{left:14%;top:25%}
.s3{left:22%;top:9%}
.s4{left:31%;top:18%}
.s5{left:39%;top:7%}
.s6{left:48%;top:23%}
.s7{left:57%;top:11%}
.s8{left:66%;top:20%}
.s9{left:75%;top:8%}
.s10{left:84%;top:26%}
.s11{left:92%;top:13%}
.s12{left:45%;top:35%}
.s13{left:11%;top:38%}
.s14{left:70%;top:34%}

/* =========================
   LUNA
========================= */

.moon{
    position:absolute;
    width:82px;
    height:82px;
    right:11%;
    top:9%;
    background:#f4e7b0;
    border-radius:50%;
    box-shadow:
        0 0 18px rgba(244,231,176,.25),
        0 0 35px rgba(244,231,176,.12);
}

.moon::after{
    content:"";
    position:absolute;
    width:82px;
    height:82px;
    left:-18px;
    top:-7px;
    border-radius:50%;
    background:#0b1020;
}

/* =========================
   NUBES
========================= */

.cloud{
    position:absolute;
    width:120px;
    height:24px;
    background:rgba(145,160,187,.15);
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
}

.cloud::before{
    width:55px;
    height:35px;
    left:15px;
    bottom:0;
}

.cloud::after{
    width:65px;
    height:30px;
    right:12px;
    bottom:0;
}

.cloud1{
    top:20%;
    left:4%;
}

.cloud2{
    top:29%;
    right:23%;
    transform:scale(.75);
}

/* =========================
   MONTAÑAS
========================= */

.mountains{
    position:absolute;
    left:0;
    bottom:27%;
    width:100%;
    height:35%;
}

.mountain{
    position:absolute;
    bottom:0;
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-bottom:250px solid #11182c;
}

.m1{
    left:-70px;
}

.m2{
    left:16%;
    transform:scale(1.25);
    border-bottom-color:#141d35;
}

.m3{
    right:8%;
    transform:scale(1.35);
    border-bottom-color:#10172b;
}

.m4{
    right:-130px;
    transform:scale(.95);
    border-bottom-color:#151d32;
}

/* =========================
   ÁRBOLES
========================= */

.tree{
    position:absolute;
    bottom:25%;
    width:18px;
    height:120px;
    background:#17120f;
}

.tree::before,
.tree::after{
    content:"";
    position:absolute;
    background:#102218;
}

.tree::before{
    width:78px;
    height:85px;
    left:-30px;
    top:-60px;
    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );
}

.tree::after{
    width:62px;
    height:70px;
    left:-22px;
    top:-90px;
    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );
}

.tree1{left:6%;transform:scale(.75)}
.tree2{left:18%;transform:scale(1)}
.tree3{right:18%;transform:scale(.8)}
.tree4{right:6%;transform:scale(1.15)}

/* =========================
   SUELO
========================= */

.ground{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    height:28%;
    background:
        linear-gradient(
            to bottom,
            #263a28 0 9px,
            #18251d 9px 100%
        );
    box-shadow:inset 0 8px 0 #314b2d;
}

.grass{
    position:absolute;
    bottom:27%;
    left:0;
    width:100%;
    height:13px;
    background:
        repeating-linear-gradient(
            90deg,
            #304d30 0 13px,
            #263f29 13px 26px
        );
}

/* =========================
   ZONA DEL GATO
========================= */

.cat-container{
    position:absolute;
    left:50%;
    bottom:25%;
    transform:translateX(-50%);
    width:260px;
    height:260px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    z-index:20;
}

/* =========================
   GATO PIXEL ART
   ORIGINAL
========================= */

.cat{
    width:220px;
    height:220px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    filter:
        drop-shadow(0 8px 0 rgba(0,0,0,.18))
        drop-shadow(0 0 7px rgba(0,0,0,.15));
}

/* =========================
   MENSAJE
========================= */

.message{
    position:absolute;
    left:50%;
    bottom:8%;
    transform:translateX(-50%);
    z-index:30;

    padding:13px 25px;

    color:#fff4d1;
    background:rgba(8,12,23,.76);

    border:3px solid #596047;
    box-shadow:
        5px 5px 0 rgba(0,0,0,.35),
        inset 0 0 0 2px #252d28;

    font-size:18px;
    font-weight:bold;
    text-align:center;
    white-space:nowrap;

    image-rendering:pixelated;
}

.message span{
    color:#f2b35c;
}

/* =========================
   PIXEL LOOK
========================= */

.pixel{
    shape-rendering:crispEdges;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .moon{
        width:60px;
        height:60px;
        right:7%;
    }

    .moon::after{
        width:60px;
        height:60px;
    }

    .cat-container{
        bottom:27%;
        transform:translateX(-50%) scale(.78);
    }

    .message{
        bottom:6%;
        font-size:14px;
        padding:10px 14px;
    }
}
</style>
</head>
